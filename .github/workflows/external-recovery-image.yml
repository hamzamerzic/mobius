name: Publish external recovery image

on:
  push:
    branches: [stack/external-recovery-v1]

permissions:
  contents: read
  packages: write

env:
  # Keep the useful build summary without retaining an unused Buildx record.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  MOBIUS_IMAGE_REPOSITORY: ghcr.io/mobius-os/mobius
  MOBIUS_RECOVERY_IMAGE_REPOSITORY: ghcr.io/mobius-os/mobius-recovery
  MOBIUS_RELEASE_CHANNEL: ghcr.io/mobius-os/mobius:external-recovery
  MOBIUS_PLATFORM_RELEASE_REF: refs/heads/stack/external-recovery-v1
  # These repository variables are set to the exact compatible A′ identity
  # only after the one-time bootstrap has established both channels. The job's
  # credentials remain protected by the external-recovery-release environment.
  RECOVERY_CUTOVER_PREREQUISITE_SHA: ${{ vars.MOBIUS_EXTERNAL_RECOVERY_PREREQUISITE_SHA }}
  RECOVERY_CUTOVER_PREREQUISITE_DIGEST: ${{ vars.MOBIUS_EXTERNAL_RECOVERY_PREREQUISITE_DIGEST }}

# A bound B/C release must be allowed to finish after its branch advances. A
# second publisher therefore waits rather than cancelling the durable owner.
concurrency:
  group: mobius-core-image-publication
  cancel-in-progress: false

jobs:
  publish:
    if: vars.MOBIUS_EXTERNAL_RECOVERY_RELEASE_ENABLED == 'true'
    environment: external-recovery-release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Keep the packages-capable job token out of checked-out Git config.
          persist-credentials: false

      - name: Resolve exact protected release identity
        id: identity
        run: |
          test "$GITHUB_REPOSITORY" = mobius-os/mobius
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = "$MOBIUS_PLATFORM_RELEASE_REF"
          case "$GITHUB_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#GITHUB_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$RECOVERY_CUTOVER_PREREQUISITE_SHA" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#RECOVERY_CUTOVER_PREREQUISITE_SHA}" -eq 40
          case "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) exit 2 ;;
          esac
          case "${RECOVERY_CUTOVER_PREREQUISITE_DIGEST#sha256:}" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "$GITHUB_SHA" != "$RECOVERY_CUTOVER_PREREQUISITE_SHA"
          git cat-file -e "$RECOVERY_CUTOVER_PREREQUISITE_SHA^{commit}"
          git merge-base --is-ancestor "$RECOVERY_CUTOVER_PREREQUISITE_SHA" "$GITHUB_SHA"

          git ls-remote --exit-code origin refs/heads/main > "$RUNNER_TEMP/main-head"
          test "$(wc -l < "$RUNNER_TEMP/main-head")" -eq 1
          read -r main_sha main_ref < "$RUNNER_TEMP/main-head"
          test "$main_ref" = refs/heads/main
          test "$main_sha" = "$RECOVERY_CUTOVER_PREREQUISITE_SHA"

          git ls-remote --exit-code origin "$MOBIUS_PLATFORM_RELEASE_REF" > "$RUNNER_TEMP/release-head"
          test "$(wc -l < "$RUNNER_TEMP/release-head")" -eq 1
          read -r release_head release_ref < "$RUNNER_TEMP/release-head"
          test "$release_ref" = "$MOBIUS_PLATFORM_RELEASE_REF"
          case "$release_head" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "${#release_head}" -eq 40
          echo "release_head=$release_head" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"
          echo "epoch=external-recovery-v1-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Inventory frozen legacy and target channels anonymously
        id: inventory
        run: |
          anonymous_config="$RUNNER_TEMP/anonymous-docker-inventory"
          install -d -m 0700 "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" python3 scripts/external_recovery_release.py \
            inventory \
            --repository "$MOBIUS_IMAGE_REPOSITORY" \
            --prerequisite-revision "$RECOVERY_CUTOVER_PREREQUISITE_SHA" \
            --prerequisite-digest "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" \
            --output "$GITHUB_OUTPUT"

      # This gate runs before registry login, image build, or any registry
      # write. It freezes the exact fleet and the latest approved recovery R.
      # A stale workflow may continue only when the controller says its exact
      # B/C digest was already durably bound.
      #
      # Contract dependency: every successful core response carries frozen
      # recovery_* plus atomically read current_recovery_* and identical
      # approved_recovery_* aliases. The parser requires all fields; active
      # cutovers additionally require the current identity to remain frozen.
      - name: Acquire durable external recovery cutover gate
        id: gate
        env:
          MOBIUS_YOU_CORE_RELEASE_URL: ${{ secrets.MOBIUS_YOU_CORE_RELEASE_URL }}
          MOBIUS_YOU_CORE_RELEASE_TOKEN: ${{ secrets.MOBIUS_YOU_CORE_RELEASE_TOKEN }}
          CUTOVER_EPOCH: ${{ steps.identity.outputs.epoch }}
        run: |
          if [ -z "${MOBIUS_YOU_CORE_RELEASE_URL:-}" ] || \
             [ -z "${MOBIUS_YOU_CORE_RELEASE_TOKEN:-}" ]; then
            echo "The separate mobius.you core-release credentials are required" >&2
            exit 1
          fi
          payload="$RUNNER_TEMP/core-release-payload.json"
          python3 - "$payload" <<'PY'
          import json
          import os
          import sys

          body = {
              "epoch": os.environ["CUTOVER_EPOCH"],
              "release_channel": os.environ["MOBIUS_RELEASE_CHANNEL"],
              "platform_release_ref": os.environ["MOBIUS_PLATFORM_RELEASE_REF"],
              "prerequisite_build_sha": os.environ["RECOVERY_CUTOVER_PREREQUISITE_SHA"],
              "prerequisite_image_digest": os.environ["RECOVERY_CUTOVER_PREREQUISITE_DIGEST"],
              "removal_build_sha": os.environ["GITHUB_SHA"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as target:
              json.dump(body, target, separators=(",", ":"))
          PY
          response="$RUNNER_TEMP/core-release-prepublish.json"
          cutover_wait_deadline=$(($(date -u +%s) + 7200))
          frozen_sequence=""
          frozen_sha=""
          frozen_digest=""
          current_r_sequence=""
          current_r_sha=""
          current_r_digest=""
          while true; do
            http_status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $MOBIUS_YOU_CORE_RELEASE_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$payload" \
              "${MOBIUS_YOU_CORE_RELEASE_URL%/}/internal/core-releases/prepublish")
            values=$(python3 scripts/external_recovery_release.py gate \
              --response "$response" \
              --http-status "$http_status" \
              --epoch "$CUTOVER_EPOCH" \
              --release-channel "$MOBIUS_RELEASE_CHANNEL" \
              --platform-release-ref "$MOBIUS_PLATFORM_RELEASE_REF" \
              --prerequisite-sha "$RECOVERY_CUTOVER_PREREQUISITE_SHA" \
              --prerequisite-digest "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" \
              --removal-sha "$GITHUB_SHA")
            IFS='|' read -r decision bound_digest frozen_sequence_seen frozen_sha_seen frozen_digest_seen current_sequence_seen current_sha_seen current_digest_seen <<EOF
          $values
          EOF
            if [ -z "$frozen_sequence" ]; then
              frozen_sequence=$frozen_sequence_seen
              frozen_sha=$frozen_sha_seen
              frozen_digest=$frozen_digest_seen
              current_r_sequence=$current_sequence_seen
              current_r_sha=$current_sha_seen
              current_r_digest=$current_digest_seen
            else
              test "$frozen_sequence_seen" = "$frozen_sequence"
              test "$frozen_sha_seen" = "$frozen_sha"
              test "$frozen_digest_seen" = "$frozen_digest"
              test "$current_sequence_seen" = "$current_r_sequence"
              test "$current_sha_seen" = "$current_r_sha"
              test "$current_digest_seen" = "$current_r_digest"
            fi
            if [ "$decision" != wait ]; then
              if [ "$decision" = build_cutover ] || [ "$decision" = normal_release ]; then
                current_sha=$(git ls-remote --exit-code origin "$MOBIUS_PLATFORM_RELEASE_REF" | awk 'NR == 1 { print $1 }')
                if [ "$current_sha" != "$GITHUB_SHA" ]; then
                  echo "Refusing an unbound release from a stale protected-branch run" >&2
                  exit 1
                fi
              fi
              echo "mode=$decision" >> "$GITHUB_OUTPUT"
              echo "bound_digest=$bound_digest" >> "$GITHUB_OUTPUT"
              echo "frozen_recovery_sequence=$frozen_sequence_seen" >> "$GITHUB_OUTPUT"
              echo "frozen_recovery_sha=$frozen_sha_seen" >> "$GITHUB_OUTPUT"
              echo "frozen_recovery_digest=$frozen_digest_seen" >> "$GITHUB_OUTPUT"
              echo "current_recovery_sequence=$current_sequence_seen" >> "$GITHUB_OUTPUT"
              echo "current_recovery_sha=$current_sha_seen" >> "$GITHUB_OUTPUT"
              echo "current_recovery_digest=$current_digest_seen" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(date -u +%s)" -ge "$cutover_wait_deadline" ]; then
              echo "Timed out waiting for the external recovery cutover gate" >&2
              exit 1
            fi
            echo "External recovery cutover is still reconciling"
            sleep 10
          done

      - name: Prove the current approved recovery worker is already public
        env:
          RECOVERY_DIGEST: ${{ steps.gate.outputs.current_recovery_digest }}
          RECOVERY_SHA: ${{ steps.gate.outputs.current_recovery_sha }}
        run: |
          anonymous_config="$RUNNER_TEMP/anonymous-docker-recovery"
          install -d -m 0700 "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" python3 scripts/external_recovery_release.py \
            worker \
            --repository "$MOBIUS_RECOVERY_IMAGE_REPOSITORY" \
            --digest "$RECOVERY_DIGEST" \
            --revision "$RECOVERY_SHA"

      - name: Verify a completed B replay without moving any channel
        if: steps.gate.outputs.mode == 'completed_replay'
        env:
          BOUND_DIGEST: ${{ steps.gate.outputs.bound_digest }}
          INITIAL_TARGET_DIGEST: ${{ steps.inventory.outputs.target_digest }}
          INITIAL_TARGET_REVISION: ${{ steps.inventory.outputs.target_revision }}
        run: |
          anonymous_config="$RUNNER_TEMP/anonymous-docker-completed-replay"
          install -d -m 0700 "$anonymous_config"
          observed=$(DOCKER_CONFIG="$anonymous_config" \
            docker buildx imagetools inspect \
            "$MOBIUS_IMAGE_REPOSITORY@$BOUND_DIGEST" \
            --format '{{.Manifest.Digest}}')
          test "$observed" = "$BOUND_DIGEST"
          revision=$(DOCKER_CONFIG="$anonymous_config" \
            docker buildx imagetools inspect \
            "$MOBIUS_IMAGE_REPOSITORY@$BOUND_DIGEST" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$GITHUB_SHA"
          DOCKER_CONFIG="$anonymous_config" python3 scripts/external_recovery_release.py \
            prewrite \
            --repository "$MOBIUS_IMAGE_REPOSITORY" \
            --prerequisite-revision "$RECOVERY_CUTOVER_PREREQUISITE_SHA" \
            --prerequisite-digest "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" \
            --target-revision "$INITIAL_TARGET_REVISION" \
            --target-digest "$INITIAL_TARGET_DIGEST"
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')
          test "$main_sha" = "$RECOVERY_CUTOVER_PREREQUISITE_SHA"

      - name: Log in to GitHub Container Registry
        if: steps.gate.outputs.mode != 'completed_replay'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable workflow-attempt image
        id: build
        if: steps.gate.outputs.mode == 'build_cutover' || steps.gate.outputs.mode == 'normal_release'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ env.MOBIUS_IMAGE_REPOSITORY }}:sha-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.identity.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Select the one immutable release digest
        id: selected
        if: steps.gate.outputs.mode != 'completed_replay'
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          BOUND_DIGEST: ${{ steps.gate.outputs.bound_digest }}
          RELEASE_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          if [ "$RELEASE_MODE" = resume_cutover ]; then
            digest=$BOUND_DIGEST
          else
            digest=$BUILT_DIGEST
          fi
          case "$digest" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "The selected image digest is invalid" >&2; exit 1 ;;
          esac
          case "${digest#sha256:}" in
            *[!0-9a-f]*|'') exit 2 ;;
          esac
          test "$digest" != "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify selected image anonymously and by baked revision
        if: steps.gate.outputs.mode != 'completed_replay'
        env:
          IMAGE_DIGEST: ${{ steps.selected.outputs.digest }}
        run: |
          anonymous_config="$RUNNER_TEMP/anonymous-docker-selected"
          install -d -m 0700 "$anonymous_config"
          observed=""
          for attempt in 1 2 3 4 5 6 7 8; do
            observed=$(DOCKER_CONFIG="$anonymous_config" \
              docker buildx imagetools inspect \
              "$MOBIUS_IMAGE_REPOSITORY@$IMAGE_DIGEST" \
              --format '{{.Manifest.Digest}}' 2>/dev/null) || true
            [ "$observed" = "$IMAGE_DIGEST" ] && break
            sleep "$attempt"
          done
          test "$observed" = "$IMAGE_DIGEST"
          revision=$(DOCKER_CONFIG="$anonymous_config" \
            docker buildx imagetools inspect \
            "$MOBIUS_IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')
          test "$revision" = "$GITHUB_SHA"

      # An unbound B/C or ordinary later release must still be branch HEAD at
      # the last boundary before binding. Once bound, the controller owns the
      # exact digest and a branch advance is deliberately harmless.
      - name: Recheck Git ownership before binding or publication
        if: steps.gate.outputs.mode != 'completed_replay'
        env:
          RELEASE_MODE: ${{ steps.gate.outputs.mode }}
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')
          test "$main_sha" = "$RECOVERY_CUTOVER_PREREQUISITE_SHA"
          if [ "$RELEASE_MODE" = build_cutover ] || [ "$RELEASE_MODE" = normal_release ]; then
            release_sha=$(git ls-remote --exit-code origin "$MOBIUS_PLATFORM_RELEASE_REF" | awk 'NR == 1 { print $1 }')
            if [ "$release_sha" != "$GITHUB_SHA" ]; then
              echo "Refusing to bind or publish a stale unbound release" >&2
              exit 1
            fi
          fi

      - name: Bind exact removal digest before moving the channel
        if: steps.gate.outputs.mode == 'build_cutover'
        env:
          MOBIUS_YOU_CORE_RELEASE_URL: ${{ secrets.MOBIUS_YOU_CORE_RELEASE_URL }}
          MOBIUS_YOU_CORE_RELEASE_TOKEN: ${{ secrets.MOBIUS_YOU_CORE_RELEASE_TOKEN }}
          CUTOVER_EPOCH: ${{ steps.identity.outputs.epoch }}
          IMAGE_DIGEST: ${{ steps.selected.outputs.digest }}
          FROZEN_RECOVERY_SEQUENCE: ${{ steps.gate.outputs.frozen_recovery_sequence }}
          FROZEN_RECOVERY_SHA: ${{ steps.gate.outputs.frozen_recovery_sha }}
          FROZEN_RECOVERY_DIGEST: ${{ steps.gate.outputs.frozen_recovery_digest }}
          CURRENT_RECOVERY_SEQUENCE: ${{ steps.gate.outputs.current_recovery_sequence }}
          CURRENT_RECOVERY_SHA: ${{ steps.gate.outputs.current_recovery_sha }}
          CURRENT_RECOVERY_DIGEST: ${{ steps.gate.outputs.current_recovery_digest }}
        run: |
          payload="$RUNNER_TEMP/core-release-bind-payload.json"
          python3 - "$payload" <<'PY'
          import json
          import os
          import sys

          body = {
              "epoch": os.environ["CUTOVER_EPOCH"],
              "release_channel": os.environ["MOBIUS_RELEASE_CHANNEL"],
              "platform_release_ref": os.environ["MOBIUS_PLATFORM_RELEASE_REF"],
              "prerequisite_build_sha": os.environ["RECOVERY_CUTOVER_PREREQUISITE_SHA"],
              "prerequisite_image_digest": os.environ["RECOVERY_CUTOVER_PREREQUISITE_DIGEST"],
              "removal_build_sha": os.environ["GITHUB_SHA"],
              "removal_image_digest": os.environ["IMAGE_DIGEST"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as target:
              json.dump(body, target, separators=(",", ":"))
          PY
          response="$RUNNER_TEMP/core-release-bind.json"
          http_status=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $MOBIUS_YOU_CORE_RELEASE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$payload" \
            "${MOBIUS_YOU_CORE_RELEASE_URL%/}/internal/core-releases/bind")
          python3 scripts/external_recovery_release.py bind \
            --response "$response" \
            --http-status "$http_status" \
            --epoch "$CUTOVER_EPOCH" \
            --release-channel "$MOBIUS_RELEASE_CHANNEL" \
            --platform-release-ref "$MOBIUS_PLATFORM_RELEASE_REF" \
            --prerequisite-sha "$RECOVERY_CUTOVER_PREREQUISITE_SHA" \
            --prerequisite-digest "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" \
            --removal-sha "$GITHUB_SHA" \
            --removal-digest "$IMAGE_DIGEST" \
            --frozen-recovery-sequence "$FROZEN_RECOVERY_SEQUENCE" \
            --frozen-recovery-sha "$FROZEN_RECOVERY_SHA" \
            --frozen-recovery-digest "$FROZEN_RECOVERY_DIGEST" \
            --current-recovery-sequence "$CURRENT_RECOVERY_SEQUENCE" \
            --current-recovery-sha "$CURRENT_RECOVERY_SHA" \
            --current-recovery-digest "$CURRENT_RECOVERY_DIGEST"

      - name: Move only external-recovery to the selected digest
        if: steps.gate.outputs.mode != 'completed_replay'
        env:
          IMAGE_DIGEST: ${{ steps.selected.outputs.digest }}
          INITIAL_TARGET_DIGEST: ${{ steps.inventory.outputs.target_digest }}
          INITIAL_TARGET_REVISION: ${{ steps.inventory.outputs.target_revision }}
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')
          test "$main_sha" = "$RECOVERY_CUTOVER_PREREQUISITE_SHA"
          anonymous_config="$RUNNER_TEMP/anonymous-docker-prewrite"
          install -d -m 0700 "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" python3 scripts/external_recovery_release.py \
            prewrite \
            --repository "$MOBIUS_IMAGE_REPOSITORY" \
            --prerequisite-revision "$RECOVERY_CUTOVER_PREREQUISITE_SHA" \
            --prerequisite-digest "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" \
            --target-revision "$INITIAL_TARGET_REVISION" \
            --target-digest "$INITIAL_TARGET_DIGEST"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$MOBIUS_RELEASE_CHANNEL" \
            "$MOBIUS_IMAGE_REPOSITORY@$IMAGE_DIGEST"
          anonymous_config="$RUNNER_TEMP/anonymous-docker-moved"
          install -d -m 0700 "$anonymous_config"
          observed=""
          for attempt in 1 2 3 4 5 6 7 8; do
            observed=$(DOCKER_CONFIG="$anonymous_config" \
              docker buildx imagetools inspect "$MOBIUS_RELEASE_CHANNEL" \
              --format '{{.Manifest.Digest}}' 2>/dev/null) || true
            [ "$observed" = "$IMAGE_DIGEST" ] && break
            sleep "$attempt"
          done
          test "$observed" = "$IMAGE_DIGEST"

      - name: Roll exact bound removal across the frozen fleet and finalize
        if: steps.gate.outputs.mode == 'build_cutover' || steps.gate.outputs.mode == 'resume_cutover'
        env:
          MOBIUS_YOU_CORE_RELEASE_URL: ${{ secrets.MOBIUS_YOU_CORE_RELEASE_URL }}
          MOBIUS_YOU_CORE_RELEASE_TOKEN: ${{ secrets.MOBIUS_YOU_CORE_RELEASE_TOKEN }}
          CUTOVER_EPOCH: ${{ steps.identity.outputs.epoch }}
          IMAGE_DIGEST: ${{ steps.selected.outputs.digest }}
          FROZEN_RECOVERY_SEQUENCE: ${{ steps.gate.outputs.frozen_recovery_sequence }}
          FROZEN_RECOVERY_SHA: ${{ steps.gate.outputs.frozen_recovery_sha }}
          FROZEN_RECOVERY_DIGEST: ${{ steps.gate.outputs.frozen_recovery_digest }}
          CURRENT_RECOVERY_SEQUENCE: ${{ steps.gate.outputs.current_recovery_sequence }}
          CURRENT_RECOVERY_SHA: ${{ steps.gate.outputs.current_recovery_sha }}
          CURRENT_RECOVERY_DIGEST: ${{ steps.gate.outputs.current_recovery_digest }}
        run: |
          payload="$RUNNER_TEMP/core-release-postpublish-payload.json"
          python3 - "$payload" <<'PY'
          import json
          import os
          import sys

          body = {
              "epoch": os.environ["CUTOVER_EPOCH"],
              "release_channel": os.environ["MOBIUS_RELEASE_CHANNEL"],
              "platform_release_ref": os.environ["MOBIUS_PLATFORM_RELEASE_REF"],
              "prerequisite_build_sha": os.environ["RECOVERY_CUTOVER_PREREQUISITE_SHA"],
              "prerequisite_image_digest": os.environ["RECOVERY_CUTOVER_PREREQUISITE_DIGEST"],
              "removal_build_sha": os.environ["GITHUB_SHA"],
              "removal_image_digest": os.environ["IMAGE_DIGEST"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as target:
              json.dump(body, target, separators=(",", ":"))
          PY
          response="$RUNNER_TEMP/core-release-postpublish.json"
          redeploy_wait_deadline=$(($(date -u +%s) + 7200))
          while true; do
            http_status=$(curl --silent --show-error --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 45 \
              --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $MOBIUS_YOU_CORE_RELEASE_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$payload" \
              "${MOBIUS_YOU_CORE_RELEASE_URL%/}/internal/core-releases/postpublish")
            decision=$(python3 scripts/external_recovery_release.py postpublish \
              --response "$response" \
              --http-status "$http_status" \
              --epoch "$CUTOVER_EPOCH" \
              --release-channel "$MOBIUS_RELEASE_CHANNEL" \
              --platform-release-ref "$MOBIUS_PLATFORM_RELEASE_REF" \
              --prerequisite-sha "$RECOVERY_CUTOVER_PREREQUISITE_SHA" \
              --prerequisite-digest "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" \
              --removal-sha "$GITHUB_SHA" \
              --removal-digest "$IMAGE_DIGEST" \
              --frozen-recovery-sequence "$FROZEN_RECOVERY_SEQUENCE" \
              --frozen-recovery-sha "$FROZEN_RECOVERY_SHA" \
              --frozen-recovery-digest "$FROZEN_RECOVERY_DIGEST" \
              --current-recovery-sequence "$CURRENT_RECOVERY_SEQUENCE" \
              --current-recovery-sha "$CURRENT_RECOVERY_SHA" \
              --current-recovery-digest "$CURRENT_RECOVERY_DIGEST")
            if [ "$decision" = success ]; then
              exit 0
            fi
            if [ "$(date -u +%s)" -ge "$redeploy_wait_deadline" ]; then
              echo "Timed out waiting for the exact removal fleet rollout" >&2
              exit 1
            fi
            echo "Exact removal rollout is still reconciling"
            sleep 10
          done

      - name: Verify final external channel and frozen legacy floor
        if: steps.gate.outputs.mode != 'completed_replay'
        env:
          IMAGE_DIGEST: ${{ steps.selected.outputs.digest }}
        run: |
          anonymous_config="$RUNNER_TEMP/anonymous-docker-final"
          install -d -m 0700 "$anonymous_config"
          DOCKER_CONFIG="$anonymous_config" python3 scripts/external_recovery_release.py \
            final \
            --repository "$MOBIUS_IMAGE_REPOSITORY" \
            --prerequisite-revision "$RECOVERY_CUTOVER_PREREQUISITE_SHA" \
            --prerequisite-digest "$RECOVERY_CUTOVER_PREREQUISITE_DIGEST" \
            --released-revision "$GITHUB_SHA" \
            --released-digest "$IMAGE_DIGEST"
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | awk 'NR == 1 { print $1 }')
          test "$main_sha" = "$RECOVERY_CUTOVER_PREREQUISITE_SHA"
